[package]
name = "calce"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Enderman-brewer"]
description = "3-in-1 calculator (Basic / Graph / CAS) for Windows, Linux and Android"
repository = "https://github.com/Enderman-brewer/calce"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
    "wayland",
    "x11",
] }
egui = "0.36.1"
num-bigint = "0.5.1"
num-rational = "0.4.2"
num-traits = "0.2.19"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
winit = "0.30"

[package.metadata.android]
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
